name: Publish

on:
  push:
    tags: ['*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Verify stable package version
        run: node -e "if (!/^[0-9]+[.][0-9]+[.][0-9]+$/.test(require('./package.json').version)) process.exit(1)"
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
      - run: npm pack --dry-run --json
      - run: npm stage publish
